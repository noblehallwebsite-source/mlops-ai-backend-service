services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    networks:
      - mlops-network
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    networks:
      - mlops-network
    ports:
      - "127.0.0.1:3001:3000"

networks:
  mlops-network:
    external: true
