name: Deploy AI Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AIOPS_HOST }}
        username: ${{ secrets.AIOPS_USER }}
        key: ${{ secrets.AIOPS_SSH_KEY }}
        script: |

          if [ ! -d ~/mlops-ai-backend-service ]; then
            git clone https://github.com/noblehallwebsite-source/mlops-ai-backend-service.git ~/mlops-ai-backend-service
          fi

          cd ~/mlops-ai-backend-service

          git fetch origin
          git reset --hard origin/main

          docker build -t mlops-ai-backend-service .

          docker stop ai-service || true
          docker rm ai-service || true

          docker run -d \
            --name ai-service \
            -p 127.0.0.1:8000:8000 \
            mlops-ai-backend-service